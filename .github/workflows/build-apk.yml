name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for direct download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/private-messenger.apk
          cp app/build/outputs/apk/debug/*.apk release-apk/itas.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-messenger-APK
          path: release-apk/private-messenger.apk
          if-no-files-found: error

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep "versionName =" app/build.gradle.kts | head -1 | awk -F '"' '{print $2}')
          if [ -z "$VERSION" ]; then
            VERSION="1.6.0"
          fi
          echo "VERSION=v$VERSION" >> $GITHUB_ENV
          echo "Building Private Messenger version v$VERSION"

      - name: Create Direct GitHub Release (Raw .APK Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.VERSION }}
          name: "Private Messenger ${{ env.VERSION }}"
          body: |
            ### 🚀 Private Messenger ${{ env.VERSION }}
            
            **What's new in this release:**
            * 🎨 **Simplified & Welcoming UI/UX:** Clean human-first design without technical jargon, sci-fi badges, or doodle clutter.
            * 🔒 **Enhanced Privacy in Contacts:** Public registered directory removed. Only displays personal saved contacts; add friends directly by @handle.
            * 🧭 **Streamlined Navigation:** Scrapped status feature; clean 4-tab bar (Chats, Contacts, Calls, Settings) with fixed top padding across all screens.
            * ⚙️ **Refreshed Settings:** Clean standard categories with Screen Privacy, Private Keyboard, and collapsible Advanced Security.
            * 🔄 **In-App Auto-Updates:** Check and download updates directly inside the app.
            
            Download `private-messenger.apk` (or `itas.apk`) below to install directly on your device.
          files: |
            release-apk/private-messenger.apk
            release-apk/itas.apk
          make_latest: true
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
